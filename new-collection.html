<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U Women & Kids | الكوليكشن الجديد 2027</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--text:#222;--muted:#777;--accent:#c2185b;--line:#eee}
@media (prefers-color-scheme:dark){:root{--bg:#161416;--card:#222024;--text:#f1eef0;--muted:#a59fa4;--accent:#f06292;--line:#33303a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 16px 8px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.bar{position:sticky;top:0;background:var(--bg);z-index:5;padding:6px 0}
.filters{display:flex;gap:8px;overflow-x:auto;padding:5px 16px}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.nav{display:flex;justify-content:space-between;gap:12px;padding:12px 16px 0;font-size:14px;max-width:1100px;margin:auto}
.nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:20px}
.card{position:relative}
.main{cursor:pointer}
.heart{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#222;font-size:19px;line-height:1;cursor:pointer}
.heart[aria-pressed="true"]{color:#c00}
.q{display:block;width:calc(100% - 32px);max-width:480px;margin:10px auto 0;padding:10px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);font:inherit;font-size:15px}
.count{padding:2px 16px 0;color:var(--muted);font-size:13px;max-width:1100px;margin:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 12px 40px;max-width:1100px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.main{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;display:block}
.thumbs{display:flex;gap:4px;padding:6px;overflow-x:auto}
.thumbs img{width:38px;height:50px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--accent)}
.info{padding:6px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.t{font-weight:600;font-size:15px}
.m{color:var(--muted);font-size:12.5px}
.p{color:var(--accent);font-weight:700;font-size:17px}
.order{margin-top:auto;display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;padding:9px;border-radius:10px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<nav class="nav"><a href="index.html">الرئيسية</a><a href="new-collection.html?fav=1" id="favLink">♡ المفضلة</a></nav>
<header>
  <h1 id="pageTitle">الكوليكشن الجديد 2027</h1>
  <p>U Women & Kids</p>
  <input class="q" id="q" type="search" enterkeyhint="search" placeholder="ابحث بالكود أو الاسم أو اللون…" aria-label="بحث">
</header>
<div class="bar">
  <div class="filters" id="fGender"></div>
  <div class="filters" id="fAge"></div>
  <div class="filters" id="filters"></div>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script src="products.js"></script>
<script>
const WHATSAPP = "201101192118";
const GENDERS = {all:"الكل",girls:"بناتي",boys:"أولادي"};
const AGES = {all:"كل السن",kids:"أطفال (حتى 6)",teen:"محير (8-16)"};
const CATS = {all:"كل الأنواع","suit-girls":"سوت بناتي","suit-boys":"سوت أولاد",hoodie:"هودي",sweatshirt:"سويت شيرت",jacket:"جاكيت",pants:"بناطيل",tops:"بلوفر / توب"};
const G_NAME = {girls:"بناتي",boys:"أولادي",both:"بناتي وأولادي"};
const A_NAME = {kids:"أطفال",teen:"محير"};
let gender = "all", age = "all", current = "all";
/* البحث: بييجي من خانة البحث في أي صفحة (?q=...) أو من الخانة اللي فوق */
let query = (new URLSearchParams(location.search).get("q") || "").trim();
let hits = null;
/* المفضلة: ?fav=1 بيعرض الموديلات اللي العميل دوس على قلبها بس */
const favOnly = new URLSearchParams(location.search).get("fav") === "1";
const FAV = window.UMODA_FAV || {has:()=>false, toggle:()=>false};
if(favOnly){
  document.getElementById("pageTitle").textContent = "المفضلة";
  const fl = document.getElementById("favLink"); fl.textContent = "كل الموديلات"; fl.href = "new-collection.html";
}
function runSearch(){ hits = (query && window.UMODA_SEARCH) ? UMODA_SEARCH(query) : null; }

/* الموديل بيظهر لو مطابق للنوع والسن المختارين (الموديل اللي للاتنين بيظهر في بناتي وفي أولادي) */
function matchGA(p){
  if(hits && hits.indexOf(String(p.code))<0) return false;
  if(favOnly && !FAV.has(p.code)) return false;
  return (gender==="all" || p.gender===gender || p.gender==="both") &&
         (age==="all" || (p.ages||[]).includes(age));
}

function row(id, map, value, pick, show){
  const el = document.getElementById(id);
  el.innerHTML = "";
  Object.keys(map).forEach(k=>{
    if(show && !show(k)) return;
    const b = document.createElement("button");
    b.textContent = map[k];
    b.className = k===value ? "on" : "";
    b.onclick = ()=>{ pick(k); renderFilters(); renderGrid(); };
    el.appendChild(b);
  });
}

function renderFilters(){
  /* لو النوع المختار مابقاش موجود مع النوع/السن الجديد، ارجع لـ "كل الأنواع" */
  if(current!=="all" && !PRODUCTS.some(p=>p.cat===current && matchGA(p))) current = "all";
  row("fGender", GENDERS, gender, k=>{ gender = k; });
  row("fAge", AGES, age, k=>{ age = k; });
  row("filters", CATS, current, k=>{ current = k; }, k=> k==="all" || PRODUCTS.some(p=>p.cat===k && matchGA(p)));
}

function renderGrid(){
  const g = document.getElementById("grid");
  g.innerHTML = "";
  const list = PRODUCTS.filter(p=>matchGA(p) && (current==="all"||p.cat===current));
  document.getElementById("count").textContent = (query ? 'نتايج البحث عن "' + query + '": ' : "") + (list.length ? list.length + " موديل" : (query ? "مفيش" : ""));
  if(!list.length){
    g.innerHTML = '<div class="empty">' + (favOnly && !query && gender==="all" && age==="all" && current==="all"
      ? 'لسه ما اخترتش موديلات في المفضلة. دوس على القلب ♡ على أي موديل علشان يتحفظ هنا.'
      : 'مفيش موديلات بالاختيار ده. جرّب تغيّر النوع أو السن أو كلمة البحث.') + '</div>';
    return;
  }
  list.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";
    card.id = "m-" + p.code;
    const main = document.createElement("img");
    main.className = "main"; main.loading = "lazy"; main.alt = p.title + " كود " + p.code; main.src = p.images[0];
    main.onclick = ()=>{ location.href = "product.html?code=" + encodeURIComponent(p.code); };
    card.appendChild(main);
    const heart = document.createElement("button");
    heart.className = "heart"; heart.type = "button";
    const paint = ()=>{ const on = FAV.has(p.code); heart.textContent = on ? "♥" : "♡"; heart.setAttribute("aria-pressed", String(on)); heart.setAttribute("aria-label", on ? "شيل من المفضلة" : "ضيف للمفضلة"); };
    heart.onclick = ()=>{ FAV.toggle(p.code); if(favOnly){ renderFilters(); renderGrid(); } else paint(); };
    paint();
    card.appendChild(heart);
    const info = document.createElement("div"); info.className = "info";
    const link = document.createElement("a");
    link.className = "order"; link.target = "_blank"; link.rel = "noopener"; link.textContent = "اطلب على واتساب";
    /* رسالة الطلب فيها لون الصورة المختارة */
    const setMsg = i=>{
      const pic = (p.imageColors && p.imageColors[i]) ? " - اللون: " + p.imageColors[i] : "";
      link.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("أهلاً، عايز أطلب: " + p.title + " - كود " + p.code + pic + " - السعر " + p.price + " ج.م");
    };
    setMsg(0);
    if(p.images.length>1){
      const th = document.createElement("div"); th.className = "thumbs";
      p.images.forEach((src,i)=>{
        const t = document.createElement("img"); t.src = src; t.loading = "lazy"; t.alt = "صورة " + (i+1);
        if(i===0) t.className = "on";
        t.onclick = ()=>{ main.src = src; th.querySelectorAll("img").forEach(x=>x.classList.remove("on")); t.classList.add("on"); setMsg(i); };
        th.appendChild(t);
      });
      card.appendChild(th);
    }
    const ages = (p.ages||[]).map(a=>A_NAME[a]).join(" / ");
    info.innerHTML =
      '<div class="t"></div>' +
      '<div class="m">كود: ' + p.code + '</div>' +
      '<div class="m">' + G_NAME[p.gender] + (ages ? ' - ' + ages : '') + '</div>' +
      '<div class="m">المقاسات: ' + p.sizes + '</div>' +
      '<div class="p">' + p.price + ' ج.م</div>';
    info.querySelector(".t").innerHTML = '<a href="product.html?code=' + encodeURIComponent(p.code) + '" style="color:inherit;text-decoration:none"></a>';
    info.querySelector(".t a").textContent = p.title;
    info.appendChild(link);
    card.appendChild(info);
    g.appendChild(card);
  });
}
const qBox = document.getElementById("q");
qBox.value = query;
qBox.addEventListener("input", ()=>{ query = qBox.value.trim(); runSearch(); renderFilters(); renderGrid(); });
qBox.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); qBox.blur(); } });
runSearch(); renderFilters(); renderGrid();
</script>
</body>
</html>
