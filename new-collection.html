<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U Women & Kids | الكوليكشن الجديد 2027</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--text:#222;--muted:#777;--accent:#c2185b;--line:#eee}
@media (prefers-color-scheme:dark){:root{--bg:#161416;--card:#222024;--text:#f1eef0;--muted:#a59fa4;--accent:#f06292;--line:#33303a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 16px 8px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 12px 40px;max-width:1100px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.main{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;display:block}
.thumbs{display:flex;gap:4px;padding:6px;overflow-x:auto}
.thumbs img{width:38px;height:50px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--accent)}
.info{padding:6px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.t{font-weight:600;font-size:15px}
.m{color:var(--muted);font-size:12.5px}
.p{color:var(--accent);font-weight:700;font-size:17px}
.order{margin-top:auto;display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;padding:9px;border-radius:10px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>الكوليكشن الجديد 2027</h1>
  <p>U Women & Kids</p>
</header>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<script src="products.js"></script>
<script>
const WHATSAPP = "201101192118";
const CATS = {all:"الكل","suit-girls":"سوت بناتي","suit-boys":"سوت أولاد",hoodie:"هودي",sweatshirt:"سويت شيرت",jacket:"جاكيت",pants:"بناطيل",tops:"بلوفر / توب"};
let current = "all";

function renderFilters(){
  const el = document.getElementById("filters");
  el.innerHTML = "";
  Object.keys(CATS).forEach(k=>{
    if(k!=="all" && !PRODUCTS.some(p=>p.cat===k)) return;
    const b = document.createElement("button");
    b.textContent = CATS[k];
    b.className = k===current ? "on" : "";
    b.onclick = ()=>{ current = k; renderFilters(); renderGrid(); };
    el.appendChild(b);
  });
}

function renderGrid(){
  const g = document.getElementById("grid");
  g.innerHTML = "";
  PRODUCTS.filter(p=>current==="all"||p.cat===current).forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";
    const main = document.createElement("img");
    main.className = "main"; main.loading = "lazy"; main.alt = p.title; main.src = p.images[0];
    card.appendChild(main);
    if(p.images.length>1){
      const th = document.createElement("div"); th.className = "thumbs";
      p.images.forEach((src,i)=>{
        const t = document.createElement("img"); t.src = src; t.loading = "lazy"; t.alt = "";
        if(i===0) t.className = "on";
        t.onclick = ()=>{ main.src = src; th.querySelectorAll("img").forEach(x=>x.classList.remove("on")); t.classList.add("on"); };
        th.appendChild(t);
      });
      card.appendChild(th);
    }
    const info = document.createElement("div"); info.className = "info";
    const msg = encodeURIComponent("أهلاً، عايز أطلب: " + p.title + " - كود " + p.code + " - السعر " + p.price + " ج.م");
    info.innerHTML =
      '<div class="t"></div>' +
      '<div class="m">كود: ' + p.code + '</div>' +
      '<div class="m">المقاسات: ' + p.sizes + '</div>' +
      '<div class="p">' + p.price + ' ج.م</div>' +
      '<a class="order" target="_blank" rel="noopener" href="https://wa.me/' + WHATSAPP + '?text=' + msg + '">اطلب على واتساب</a>';
    info.querySelector(".t").textContent = p.title;
    card.appendChild(info);
    g.appendChild(card);
  });
}
renderFilters(); renderGrid();
</script>
</body>
</html>
