<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حريمي | U Women & Kids</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#222; --muted:#777; --line:#e6e2dd;
    --accent:#b0476b; --chip:#f6f2ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif}
  .wrap{max-width:1200px;margin:auto;padding:24px 16px 60px}
  h1{font-size:1.8rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .filters button{border:1px solid var(--line);background:var(--chip);color:var(--ink);
    padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 20px}
  .card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fafafa;display:block;border-radius:6px}
  .card h3{font-size:1rem;margin:12px 0 2px}
  .code{color:var(--muted);font-size:.8rem}
  .price{font-weight:600;color:var(--accent);margin:6px 0}

  .swatches{display:flex;gap:6px;margin:8px 0}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;
      box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
  .sw.on{box-shadow:0 0 0 2px var(--ink)}
  .cname{font-size:.85rem;color:var(--muted)}

  .sizes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .sizes button{min-width:40px;padding:6px 10px;border:1px solid var(--line);background:#fff;
    border-radius:4px;font:inherit;font-size:.85rem;cursor:pointer}
  .sizes button.on{border-color:var(--ink);background:var(--ink);color:#fff}

  .add{width:100%;padding:11px;border:0;border-radius:4px;background:var(--accent);
       color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}
  .add:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#050505;color:#fff;padding:12px 16px}
  .bar a{color:#fff;text-decoration:none;font-size:.9rem}.bar .brand{font-weight:600;letter-spacing:.05em}
  .cartbtn{background:none;border:1px solid #666;color:#fff;border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer}
  .toast button{background:#fff;color:#000;border:0;border-radius:12px;padding:3px 10px;margin-inline-start:8px;font:inherit;cursor:pointer}
  .toast{pointer-events:auto}
</style>
</head>
<body>
<header class="bar">
  <a href="/" class="home">← الرئيسية</a>
  <a href="/" class="brand">U WOMEN &amp; KIDS</a>
  <button class="cartbtn" type="button" aria-label="السلة">🛍️ <span id="cnt">0</span></button>
</header>
<div class="wrap">
  <h1>كولكشن الحريمي</h1>
  <p class="sub">قمصان، فساتين، جيب وبنطلونات</p>

  <div class="filters" id="filters">
    <button data-cat="all" class="on">الكل</button>
    <button data-cat="shirt">قمصان</button>
    <button data-cat="dress">فساتين</button>
    <button data-cat="skirt">جيب</button>
    <button data-cat="pant">بنطلونات</button>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>

<script>

<script>
const grid = document.getElementById('grid');

function card(p){
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.cat = p.category;
  let color = 0;
  let size = p.sizes.length === 1 ? p.sizes[0] : null;

  el.innerHTML = `
    <img src="${p.colors[0].img}" alt="${p.name}" loading="lazy">
    <h3>${p.name}</h3>
    <div class="code">كود: ${p.code}</div>
    <div class="price">${p.price} ج.م</div>
    <div class="swatches">${p.colors.map((c,i)=>
      `<button class="sw ${i===0?'on':''}" style="background:${c.hex}" title="${c.name}" aria-label="${c.name}" data-i="${i}"></button>`).join('')}
    </div>
    <div class="cname">اللون: <span>${p.colors[0].name}</span></div>
    <div class="sizes">${p.sizes.map(s=>
      `<button class="${size===s?'on':''}" data-s="${s}">${s}</button>`).join('')}
    </div>
    <button class="add" ${size?'':'disabled'}>${size?'أضف للسلة':'اختاري المقاس'}</button>`;

  const img = el.querySelector('img');
  const cname = el.querySelector('.cname span');
  const add = el.querySelector('.add');

  el.querySelectorAll('.sw').forEach(b => b.onclick = () => {
    color = +b.dataset.i;
    el.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b));
    img.src = p.colors[color].img;
    cname.textContent = p.colors[color].name;
  });

  el.querySelectorAll('.sizes button').forEach(b => b.onclick = () => {
    size = b.dataset.s;
    el.querySelectorAll('.sizes button').forEach(x => x.classList.toggle('on', x === b));
    add.disabled = false;
    add.textContent = 'أضف للسلة';
  });

  add.onclick = () => {
    const item = {
      id: p.code, name: { en: p.en + ' - ' + p.code, ar: p.name + ' - ' + p.code },
      price: p.price, color: p.colors[color].name, size: size, qty: 1
    };
    if (window.UCart) window.UCart.add(item); else saveToCart(item);
    toast(`اتضاف ${p.name} للسلة`);
  };
  return el;
}

// سلة احتياطية لو مفيش دالة جاهزة في الموقع
function saveToCart(item){
  try {
    const s = JSON.parse(localStorage.getItem('u-cart-v1')) || {items:[],code:''};
    const f = s.items.find(o => o.id===item.id && o.color===item.color && o.size===item.size);
    if (f) f.qty++; else s.items.push(item);
    localStorage.setItem('u-cart-v1', JSON.stringify(s));
  } catch(e){}
}

function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = ''; t.append(msg);
  const b = document.createElement('button'); b.textContent = 'عرض السلة';
  b.onclick = () => window.UCart && window.UCart.open(); t.append(b);
  t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500);
}

WOMEN_PRODUCTS.forEach(p => grid.appendChild(card(p)));

document.getElementById('filters').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.card').forEach(c =>
    c.style.display = (b.dataset.cat === 'all' || c.dataset.cat === b.dataset.cat) ? '' : 'none');
};
</script>
<script src="config.js"></script>
